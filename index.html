<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Organizador</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="top-bar">
        <div class="logo-area">
            <div class="logo-placeholder">·T··</div>
            <!-- Pode substituir a div acima pela imagem com a tag <img> -->
            <!-- <img src="sua-logo.png" alt="Logo" class="logo"> -->
            <h1>Sistema</h1>
        </div>
        <div class="search-area">
            <input type="text" id="searchInput" placeholder="Pesquisar cards ou tags...">
            <button class="btn-icon" onclick="exportData()" title="Baixar Backup">📥</button>
            <button class="btn-icon" onclick="document.getElementById('importFile').click()"
                title="Importar Backup">📤</button>
            <input type="file" id="importFile" accept=".json" hidden onchange="importData(event)">
        </div>
    </header>

    <main class="board-container">
        <div class="board">

            <!-- Coluna 1 -->
            <div class="column" data-col="1">
                <div class="column-header">
                    <h2 id="col-1-count">B1</h2>
                    <button class="add-card-btn" onclick="openCardModal('1')">+ Novo Card</button>
                </div>
                <div class="card-list" id="col-1-list">
                    <!-- Cards dinâmicos -->
                </div>
            </div>

            <!-- Coluna 2 -->
            <div class="column" data-col="2">
                <div class="column-header">
                    <h2 id="col-2-count">P2</h2>
                    <button class="add-card-btn" onclick="openCardModal('2')">+ Novo Card</button>
                </div>
                <div class="card-list" id="col-2-list">
                    <!-- Cards dinâmicos -->
                </div>
            </div>

            <!-- Coluna 3 -->
            <div class="column" data-col="3">
                <div class="column-header">
                    <h2 id="col-3-count">P3</h2>
                    <button class="add-card-btn" onclick="openCardModal('3')">+ Novo Card</button>
                </div>
                <div class="card-list" id="col-3-list">
                    <!-- Cards dinâmicos -->
                </div>
            </div>

        </div>
    </main>

    <!-- Modal Card -->
    <div id="cardModal" class="modal hidden">
        <div class="modal-content">
            <h3 id="cardModalTitle">Novo Card</h3>
            <div class="input-group">
                <label for="cardName">Nome / Título</label>
                <input type="text" id="cardName" placeholder="Ex: Projeto Principal" required autocomplete="off">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModals()">Cancelar</button>
                <button class="btn-primary" onclick="saveCard()">Salvar Card</button>
            </div>
        </div>
    </div>

    <!-- Modal Sub-Card -->
    <div id="subCardModal" class="modal hidden">
        <div class="modal-content">
            <h3 id="subCardModalTitle">Novo Sub-Card</h3>
            <div class="input-group">
                <label for="scName">Nome da Tarefa <span class="req">*</span></label>
                <input type="text" id="scName" placeholder="Título" required autocomplete="off">
            </div>
            <div class="input-group">
                <label for="scDesc">Descrição</label>
                <textarea id="scDesc" placeholder="Detalhes opcionais..."></textarea>
            </div>
            <div class="row">
                <div class="input-group">
                    <label for="scLocal">Local</label>
                    <input type="text" id="scLocal" placeholder="Ex: Escritório" autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="scArea">Área</label>
                    <input type="text" id="scArea" placeholder="Ex: Marketing" autocomplete="off">
                </div>
            </div>
            <div class="input-group">
                <label for="scTag">Tag Visual <span class="req">*</span></label>
                <input type="text" id="scTag" placeholder="Ex: Urgente" required autocomplete="off">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModals()">Cancelar</button>
                <button class="btn-primary" onclick="saveSubCard()">Salvar Sub-Card</button>
            </div>
        </div>
    </div>

    <!-- Toasts -->
    <div id="toast-container" class="toast-container"></div>

    <script src="script.js"></script>
</body>

</html>
